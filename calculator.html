<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Simple calculator</h1>
    <hr>
    <div class="flex">
    <div class="container">
        <input type="text" id="display">
        <button onclick="cleardisplay()">c</button>
        <button onclick="displayValue('/')">/</button>
        <button onclick="displayValue('')"></button>
        <button onclick="displayValue('-')">-</button>
        <br>
        <button onclick="displayValue('7')">7</button>
        <button onclick="displayValue('8')">8</button>
        <button onclick="displayValue('9')">9</button>
        <button onclick="displayValue('+')">+</button>
        <br>
        <button onclick="displayValue('4')">4</button>
        <button onclick="displayValue('5')">5</button>
        <button onclick="displayValue('6')">6</button>
        <button onclick="calculate()">=</button>
        <br>
        <button onclick="displayValue('1')">1</button>
        <button onclick="displayValue('2')">2</button>
        <button onclick="displayValue('3')">3</button>
        <button onclick="displayValue('0')">0</button>
        <br>
    </div>
    </div>
</body>
<style>
    .flex{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container {
        border: solid 2px black;
        padding: 10px;
        border-radius: 10px;
        max-width: 300px;
        margin: auto;
        box-shadow: 0px 0px 5px 2px black;
    }
    #display {
        margin-top: 5px;
        font-size: large;
        padding: 10px;
        width: 92%;
        text-align: right;
    }
    button {
        font-family: monospace;
        font-size: 30px;
        padding: 10px 20px;
        margin: 6px;
    }
</style>
</html>
<script>
    function displayValue(symbol) {
        document.getElementById('display').value+=symbol;
    }
    function cleardisplay() {
        document.getElementById('display').value="";
    }
    function calculate(){
        let exp=document.getElementById('display').value;
        let result = eval(exp);
        document.getElementById('display').value=result;
    }
</script>
